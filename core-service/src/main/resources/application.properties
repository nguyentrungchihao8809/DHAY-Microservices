# ===============================
# 1. ĐỊNH DANH SERVICE (Đồng bộ Docker & Eureka)
# ===============================
spring.application.name=dhay-core-service
server.port=8080

# ===============================
# 2. DATABASE CONNECTION (PostgreSQL + PostGIS)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db-core:5432/hday_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_hday}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_hday}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tối ưu hóa Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# 3. JPA / HIBERNATE
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# 4. JACKSON & TIMEZONE (Đồng bộ Asia/Ho_Chi_Minh)
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================
# 5. REDIS & MESSAGING (RabbitMQ)
# ===============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=6379

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Fix lỗi Placeholder cho RabbitMQConfig
app.rabbitmq.payment-success-queue=${PAYMENT_QUEUE:payment.success.queue}
app.rabbitmq.payment-exchange=${PAYMENT_EXCHANGE:payment.exchange}

# ===============================
# 6. GRPC (AI Matching Service)
# ===============================
grpc.client.ai-matching.address=${GRPC_CLIENT_AI_SERVICE_ADDRESS:static://ai-matching:50051}
grpc.client.ai-matching.negotiation-type=plaintext

# ===============================
# 7. SERVICE DISCOVERY (EUREKA)
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Cấu hình Instance chạy trong Docker
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

# ===============================
# 8. SECURITY & JWT (Fix lỗi startup Bean)
# ===============================
# Mặc dù Gateway validate, Core vẫn cần Secret để "Generate" Token lúc Login
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Fix lỗi Placeholder: app.internal-api-key vs app.internal.api-key
# Khai báo cả 2 kiểu để khớp với mọi Controller (ví dụ InternalTripController)
app.internal.api-key=${INTERNAL_GATEWAY_KEY:dhay_secret_2026}
app.internal-api-key=${INTERNAL_GATEWAY_KEY:dhay_secret_2026}

# ===============================
# 9. LOGGING & MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.root=INFO
logging.level.com.duan.hday=DEBUG
management.endpoints.web.exposure.include=health,info,metrics