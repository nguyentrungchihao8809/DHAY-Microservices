# ===============================
# 1. GENERAL CONFIGURATION
# ===============================
server.port=8080
spring.application.name=dhay-gateway

# ===============================
# 2. EUREKA CLIENT CONFIG
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# Kích hoạt Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ===============================
# 3. ROUTING & FILTERS (QUAN TRỌNG)
# ===============================

# --- 3.5 DEFAULT FILTERS (Áp dụng cho mọi Service) ---
# Dòng này sẽ sửa lỗi "CORE NHẬN KEY: [null]"
# Nó tự động thêm Header bảo mật vào mỗi request gửi đi từ Gateway
spring.cloud.gateway.default-filters[0]=AddRequestHeader=X-Internal-Key,dhay_secret_2026

# --- ROUTE 0: CORE SERVICE ---
# --- ROUTE 0: CORE SERVICE (ĐÃ XÓA /api/v1/auth/**) ---
spring.cloud.gateway.routes[0].id=dhay-core-service
spring.cloud.gateway.routes[0].uri=lb://dhay-core-service
# Lưu ý: Chỉ để các path KHÔNG phải auth ở đây vì auth đã xử lý ở Java Config
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/members/**, /api/v1/system/**, /api/v1/devices/**, /api/v1/users/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# --- ROUTE 1: AI MATCHING SERVICE ---
spring.cloud.gateway.routes[1].id=ai-matching-service
spring.cloud.gateway.routes[1].uri=lb://AI-MATCHING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/matching/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# --- ROUTE 2: PAYMENT SERVICE ---
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# ===============================
# 4. SECURITY & JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Danh sách Whitelist (Cập nhật thêm path login/register nếu cần)
app.security.whitelist=/api/v1/auth/login,/api/v1/auth/register,/api/v1/system/health,/api/v1/matching/health

# ===============================
# 5. CORS & TIMEOUTS
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=15s

# Cấu hình timeout riêng cho AI (ví dụ 30s) nếu 15s là không đủ
spring.cloud.gateway.routes[1].metadata.response-timeout=30000
spring.cloud.gateway.routes[1].metadata.connect-timeout=5000