spring.application.name=dhay-gateway

server.port=8080
spring.application.name=dhay-gateway

# Cấu hình Eureka Client cho Gateway
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Kích hoạt tính năng tự động tìm service qua Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ĐỊNH TUYẾN (ROUTING)
# 1. Route cho Core Service (Auth, User, v.v.)
spring.cloud.gateway.routes[0].id=hday-core-service
spring.cloud.gateway.routes[0].uri=lb://hday-core-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/members/**, /api/v1/system/**, /api/v1/devices/**

# 2. Route cho AI Matching Service (nếu có)
spring.cloud.gateway.routes[1].id=ai-matching-service
spring.cloud.gateway.routes[1].uri=lb://ai-matching-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/matching/**

# Cấu hình CORS (Nếu gọi từ Web/Mobile trực tiếp đến Gateway)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Thời gian chờ kết nối (Connect Timeout)
spring.cloud.gateway.httpclient.connect-timeout=5000
# Thời gian chờ phản hồi (Response Timeout)
spring.cloud.gateway.httpclient.response-timeout=10s

# Route cho Payment Service (Dùng để tạo link VNPay và nhận Webhook)
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/payments/**

# Route cho Notification Service
# Mặc dù service này chạy ngầm, nhưng Client vẫn cần gọi để đăng ký Token thiết bị (UserDevice)
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/notifications/**