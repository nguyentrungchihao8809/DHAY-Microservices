services:
  # --- CORE DATABASE (PostGIS) ---
  db-core:
    image: postgis/postgis:16-3.4-alpine
    container_name: hday-db-core
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: hday_core_db
      POSTGRES_USER: user_hday
      POSTGRES_PASSWORD: password_hday
    networks:
      - hday-network
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "hday_core_db", "-U", "user_hday"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- REDIS ---
  redis:
    image: redis:alpine
    container_name: hday-redis
    restart: always
    networks:
      - hday-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RABBITMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hday-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - hday-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DISCOVERY SERVER (EUREKA) ---
  discovery-server:
    build: ./discovery-server
    container_name: hday-discovery
    restart: always
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    ports:
      - "8761:8761"
    networks:
      - hday-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API GATEWAY (Cửa ngõ chính) ---
  dhay-gateway:
    build: ./dhay-gateway
    container_name: hday-gateway
    restart: on-failure
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - INTERNAL_GATEWAY_KEY=dhay_secret_2026
    ports:
      - "8000:8080" # User gọi vào cổng 8000
    networks:
      - hday-network

  # --- CORE SERVICE (Logic chính) ---
  dhay-core-service:
    build: ./core-service
    container_name: hday-core-app
    restart: on-failure
    depends_on:
      db-core: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_APPLICATION_NAME=dhay-core-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-core:5432/hday_core_db
      - SPRING_DATASOURCE_USERNAME=user_hday
      - SPRING_DATASOURCE_PASSWORD=password_hday
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - INTERNAL_GATEWAY_KEY=dhay_secret_2026
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks:
      - hday-network

  # --- AI MATCHING SERVICE ---
  ai-matching:
    build: ./ai-matching-service
    container_name: hday-ai-service
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://ai_user:ai_password@db-ai:5432/hday_ai_db
    networks:
      - hday-network
    command: python matching_service.py

  # --- PGADMIN (Công cụ quản lý DB) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: hday-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    networks:
      - hday-network

networks:
  hday-network:
    name: hday-shared-net
    driver: bridge

volumes:
  postgres_core_data:
  postgres_ai_data:
  postgres_payment_data: