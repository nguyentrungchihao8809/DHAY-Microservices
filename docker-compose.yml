services:
  # --- CORE DATABASE (PostGIS) ---
  db-core:
    image: postgis/postgis:16-3.4-alpine
    container_name: dhay-db-core
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: dhay_core_db
      POSTGRES_USER: user_dhay  
      POSTGRES_PASSWORD: password_dhay
    networks:
      - dhay-network
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "dhay_core_db", "-U", "user_dhay"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-ai:
    image: postgis/postgis:15-3.3
    container_name: dhay-db-ai
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: dhay_ai_db
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5433:5432"
    networks:
      - dhay-network
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d dhay_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-payment:
    image: postgres:16-alpine # Payment không cần PostGIS, Postgres nhẹ là đủ
    container_name: dhay-db-payment
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: dhay_payment_db
      POSTGRES_USER: user_dhay
      POSTGRES_PASSWORD: password_dhay
    ports:
      - "5434:5432" # Ánh xạ ra ngoài máy thật port 5434
    networks:
      - dhay-network
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "dhay_payment_db", "-U", "user_dhay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- REDIS ---
  redis:
    image: redis:alpine
    container_name: dhay-redis
    restart: always
    networks:
      - dhay-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RABBITMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dhay-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - dhay-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DISCOVERY SERVER (EUREKA) ---
  discovery-server:
    build: ./discovery-server
    container_name: dhay-discovery
    restart: always
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    ports:
      - "8761:8761"
    networks:
      - dhay-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API GATEWAY (Cửa ngõ chính) ---
  dhay-gateway:
    build: ./dhay-gateway
    container_name: dhay-gateway
    restart: on-failure
    depends_on:
      discovery-server: { condition: service_healthy }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - INTERNAL_GATEWAY_KEY=dhay_secret_2026

      # THÊM DÒNG NÀY: Cấu hình menu chọn Service trong Swagger UI
      - SPRINGDOC_SWAGGER_UI_URLS_0_NAME=Core-Service
      - SPRINGDOC_SWAGGER_UI_URLS_0_URL=/dhay-core-service/v3/api-docs
      - SPRINGDOC_SWAGGER_UI_URLS_1_NAME=Payment-Service
      - SPRINGDOC_SWAGGER_UI_URLS_1_URL=/payment-service/v3/api-docs
      - SPRINGDOC_SWAGGER_UI_URLS_2_NAME=Notification-Service
      - SPRINGDOC_SWAGGER_UI_URLS_2_URL=/notification-service/v3/api-docs

      - SPRINGDOC_SWAGGER_UI_ENABLED=true
      - SPRINGDOC_API_DOCS_ENABLED=true
      - SPRINGDOC_SWAGGER_UI_CONFIG_URL=/v3/api-docs/swagger-config
    ports:
      - "8000:8080"
    networks:
      - dhay-network

  # --- CORE SERVICE (Logic chính) ---
  dhay-core-service:
    build: ./core-service
    container_name: dhay-core-app
    restart: on-failure
    depends_on:
      db-core: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

    stop_grace_period: 10s
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_APPLICATION_NAME=dhay-core-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-core:5432/dhay_core_db
      - SPRING_DATASOURCE_USERNAME=user_dhay
      - SPRING_DATASOURCE_PASSWORD=password_dhay
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - APP_INTERNAL_API_KEY=dhay_secret_2026 
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - SPRINGDOC_API_DOCS_PATH=/v3/api-docs
      - SPRINGDOC_SWAGGER_UI_PATH=/swagger-ui.html
    networks:
      - dhay-network

  # --- AI MATCHING SERVICE ---
  ai-matching:
    build: ./ai-matching-service
    container_name: ai-matching
    restart: always
    env_file:
      - ./ai-matching-service/.env
    ports:
      - "50051:50051" # Mở port gRPC ra mạng nội bộ
      - "8002:8000"
    depends_on:
      db-ai:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://ai_user:ai_password@db-ai:5432/dhay_ai_db
      - EUREKA_SERVER=http://discovery-server:8761/eureka/apps/
      - SERVICE_NAME=ai-matching-service
    networks:
      - dhay-network
    command: python main.py


  notification-service:
    build: ./notification-service
    container_name: dhay-notification
    restart: on-failure
    depends_on:
      db-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Kết nối Eureka (Quan trọng để các service thấy nhau)
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/

      # Database: Sửa lại user/pass/db theo đúng db-core của hệ thống
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-core:5432/dhay_core_db
      - SPRING_DATASOURCE_USERNAME=user_dhay
      - SPRING_DATASOURCE_PASSWORD=password_dhay

      # Redis & RabbitMQ
      - REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq

      # Đường dẫn file Firebase trong container
      - FIREBASE_CONFIG_PATH=/app/secrets/serviceAccountKey.json
    volumes:
      # Mount file key từ máy thật vào đúng vị trí Dockerfile cần
      - ./notification-service/src/main/resources/serviceAccountKey.json:/app/secrets/serviceAccountKey.json
    networks:
      - dhay-network

  payment-service:
    build: ./payment-service
    container_name: dhay-payment-app
    restart: on-failure
    depends_on:
      db-payment: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      dhay-core-service: { condition: service_started }
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8084
      - SPRING_APPLICATION_NAME=payment-service
      # Database config
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-payment:5432/dhay_payment_db
      - SPRING_DATASOURCE_USERNAME=user_dhay
      - SPRING_DATASOURCE_PASSWORD=password_dhay
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      
      # Service Discovery
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=payment-service
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      
      # Kết nối nội bộ (Dùng tên service thay vì localhost)
      - APP_SERVICES_CORE_URL=http://dhay-core-service:8080
      - APP_INTERNAL_API_KEY=dhay_secret_2026
      
      # RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      
      # VNPay Config
      - APP_PAYMENT_VNPAY_TMN_CODE=2QXUI4J4
      - APP_PAYMENT_VNPAY_SECRET_KEY=99999999999999999999999999999999
      - APP_PAYMENT_VNPAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      # Trỏ về Gateway để đồng bộ logic bảo mật
      - APP_PAYMENT_VNPAY_RETURN_URL=http://localhost:8000/api/v1/payments/vnpay-callback

      - SPRINGDOC_API_DOCS_PATH=/v3/api-docs
    ports:
      - "8084:8084"
    networks:
      - dhay-network


  # --- PGADMIN (Công cụ quản lý DB) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: dhay-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    networks:
      - dhay-network

networks:
  dhay-network:
    name: dhay-shared-net
    driver: bridge

volumes:
  postgres_core_data:
  postgres_ai_data:
  postgres_payment_data: