services:
  # --- CORE DATABASE ---
  db-core:
    image: postgis/postgis:16-3.4-alpine
    container_name: hday-db-core
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: hday_core_db
      POSTGRES_USER: user_hday
      POSTGRES_PASSWORD: password_hday
    ports:
      - "5432:5432"
    networks:
      - hday-network
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "hday_core_db", "-U", "user_hday"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- AI DATABASE ---
  db-ai:
    image: postgis/postgis:15-3.3
    container_name: hday-db-ai
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: hday_ai_db
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5433:5432"
    networks:
      - hday-network
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d hday_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-payment:
    image: postgres:16-alpine # Payment không cần PostGIS, Postgres nhẹ là đủ
    container_name: hday-db-payment
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: hday_payment_db
      POSTGRES_USER: user_hday
      POSTGRES_PASSWORD: password_hday
    ports:
      - "5434:5432" # Ánh xạ ra ngoài máy thật port 5434
    networks:
      - hday-network
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "hday_payment_db", "-U", "user_hday"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- REDIS (Trạm trung chuyển) ---
  redis:
    image: redis:alpine
    container_name: hday-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - hday-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- AI MATCHING SERVICE ---
  ai-matching:
    build: ./ai-matching-service
    container_name: hday-ai-service
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://ai_user:ai_password@db-ai:5432/hday_ai_db
    ports:
      - "50051:50051"
    networks:
      - hday-network
    depends_on:
      db-ai:
        condition: service_healthy
    command: python matching_service.py

  # --- JAVA APP (CORE) ---
  app:
    build: ./core-service
    container_name: hday-app
    restart: on-failure
    depends_on:
      db-core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-matching:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-core:5432/hday_core_db
      - SPRING_DATASOURCE_USERNAME=user_hday
      - SPRING_DATASOURCE_PASSWORD=password_hday
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - GRPC_CLIENT_AI_SERVICE_ADDRESS=static://ai-matching:50051
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - APP_INTERNAL_API_KEY=hday_secret_2026
      - APP_RABBITMQ_PAYMENT_SUCCESS_QUEUE=payment.success.queue
      - APP_RABBITMQ_PAYMENT_EXCHANGE=payment.exchange
    # Core-service bây giờ không cần mount file firebase nữa
    ports:
      - "8080:8080"
    networks:
      - hday-network

  # --- NOTIFICATION SERVICE ---
  notification-service:
    build: ./notification-service
    container_name: hday-notification
    restart: on-failure
    depends_on:
      db-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-core:5432/hday_core_db
      - SPRING_DATASOURCE_USERNAME=user_hday
      - SPRING_DATASOURCE_PASSWORD=password_hday
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - hday-network

  payment-service:
    build: ./payment-service
    container_name: hday-payment-app
    restart: on-failure
    depends_on:
      db-payment: { condition: service_healthy }
      rabbitmq: { condition: service_healthy } # Thêm cái này
      app: { condition: service_started }      # Đợi Core sẵn sàng để Feign gọi
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-payment:5432/hday_payment_db
      - SPRING_DATASOURCE_USERNAME=user_hday
      - SPRING_DATASOURCE_PASSWORD=password_hday
      # Kết nối sang Core-service (Tên service trong docker là 'app')
      - APP_SERVICES_CORE_URL=http://app:8080
      - APP_INTERNAL_API_KEY=hday_secret_2026
      # Kết nối RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      # VNPay Config (Khớp với Strategy)
      - APP_PAYMENT_VNPAY_TMN_CODE=2QXUI4J4
      - APP_PAYMENT_VNPAY_SECRET_KEY=99999999999999999999999999999999
      - APP_PAYMENT_VNPAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - APP_PAYMENT_VNPAY_RETURN_URL=http://localhost:8084/api/v1/payments/vnpay-callback
    ports:
      - "8084:8084"
    networks:
      - hday-network

  # --- PGADMIN ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: hday-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8888:80"
    networks:
      - hday-network
    depends_on:
      - db-core
      - db-ai
      - db-payment

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hday-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Cổng cho ứng dụng kết nối
      - "15672:15672" # Cổng cho UI quản lý (truy cập localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - hday-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hday-network:
    name: hday-shared-net
    driver: bridge

volumes:
  postgres_core_data:
  postgres_ai_data:
  postgres_payment_data: