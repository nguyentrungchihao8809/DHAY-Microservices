spring.application.name=notification-service
server.port=8081

# --- TIMEZONE ---
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# --- SERVICE DISCOVERY ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=dhay-notification
eureka.instance.instance-id=${spring.application.name}:${random.value}

# --- DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db-core:5432/dhay_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_dhay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_dhay}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Fix
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.jpa.open-in-view=false

# --- REDIS ---
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# --- FIREBASE ---
app.firebase.config-path=${FIREBASE_CONFIG_PATH:/app/secrets/serviceAccountKey.json}

# --- MONITORING ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always