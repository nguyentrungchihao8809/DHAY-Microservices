spring.application.name=notification-service
server.port=8081

# --- Kết nối Redis ---
# Khi chạy Docker, host phải là tên service "redis" trong docker-compose
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# --- Kết nối Database (Dùng chung hday_db) ---
# Dùng biến môi trường để Docker tự map, mặc định vẫn là localhost để chạy máy cá nhân
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hday_core_db}
spring.datasource.username=user_hday
spring.datasource.password=password_hday

# Quan trọng: none để không làm hỏng cấu hình bảng của Core
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Firebase Config ---
app.firebase.config-path=/app/secrets/firebase-key.json

# --- Cấu hình giữ App luôn sống ---
# XÓA HOẶC ĐỔI THÀNH 'servlet' để Tomcat chạy và giữ Service không bị exit 0
spring.main.web-application-type=servlet

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy