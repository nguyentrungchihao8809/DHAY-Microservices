spring.application.name=notification-service
server.port=8081

# --- Kết nối Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# --- Kết nối Database (Dùng chung db-core) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db-core:5432/hday_core_db}
spring.datasource.username=user_hday
spring.datasource.password=password_hday
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Firebase Config ---
app.firebase.config-path=/app/secrets/firebase-key.json
spring.main.web-application-type=servlet

# --- SERVICE DISCOVERY (EUREKA) ---
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true