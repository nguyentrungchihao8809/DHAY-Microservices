# Momo Sandbox Config (Bổ sung dự phòng)
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:MOMOBKUN20180529}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:klm0567as981H}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:at67s98123000dfasdfasdfasdfasdfasdf}
app.payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
app.payment.momo.return-url=http://localhost:8084/api/v1/payments/momo-callback

# ===============================
# 8. LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.duan.payment=DEBUG
# Bật log cho FeignClient để dễ debug lỗi gọi API nội bộ
logging.level.com.duan.payment.client=DEBUG