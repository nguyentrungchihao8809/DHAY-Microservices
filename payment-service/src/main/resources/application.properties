# ===============================
# 1. APPLICATION CONFIGURATION
# ===============================
spring.application.name=payment-service
server.port=8084

# ===============================
# 2. DATABASE CONNECTION (PostgreSQL)
# ===============================
# Kết nối đến DB riêng: hday_payment_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db-payment:5432/hday_payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_hday}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_hday}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===============================
# 3. JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Đồng bộ chiến lược đặt tên với Core (Ví dụ: idempotencyKey -> idempotency_key)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# SQL Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 4. JACKSON & TIMEZONE (Quan trọng để khớp với Core)
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# 5. RABBITMQ CONFIGURATION
# ===============================
# Dùng để gửi event PAYMENT_SUCCESS sang cho Core và Notification
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ===============================
