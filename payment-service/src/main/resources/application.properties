# ===============================
# 1. APPLICATION CONFIGURATION
# ===============================
spring.application.name=payment-service
server.port=8084

# ===============================
# 2. DATABASE CONNECTION (PostgreSQL)
# ===============================
# Kết nối đến DB riêng: hday_payment_db
# Ưu tiên lấy biến môi trường từ Docker, nếu không có sẽ dùng localhost (để test local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/hday_payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_hday}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_hday}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===============================
# 3. JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# SQL Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 4. JACKSON & TIMEZONE
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# 5. RABBITMQ CONFIGURATION
# ===============================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Tên Exchange để bắn tin nhắn sang Core-service
app.rabbitmq.payment-exchange=payment.exchange

# ===============================
# 6. INTERNAL SERVICE COMMUNICATION (FeignClient)
# ===============================
# URL gọi sang Core-service (Trong Docker dùng 'http://app:8080')
app.services.core-url=${APP_SERVICES_CORE_URL:http://localhost:8080}

# Mật khẩu nội bộ để xác thực với Core-service
app.internal-api-key=${APP_INTERNAL_API_KEY:hday_secret_2026}

# ===============================
# 7. PAYMENT STRATEGY CONFIGURATION
# ===============================

# VNPay Sandbox Config
app.payment.vnpay.tmn-code=${VNP_TMN_CODE:2QXUI4J4}
app.payment.vnpay.secret-key=${VNP_HASH_SECRET:99999999999999999999999999999999}
app.payment.vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# Khi chạy thật hoặc Docker, VNPay sẽ gọi về browser user -> localhost:8084 là hợp lý
